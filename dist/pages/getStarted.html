<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Log in or Register" />
    <style>@import url('https://fonts.googleapis.com/css2?family=Jersey+10&family=Noto+Sans+Mono:wght@100..900&display=swap');</style>
    <title>Get Started - 8 Bit Alley</title>
  <link rel="stylesheet" crossorigin href="/assets/styles-BAzwTMee.css">
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>
            <a href="/pages/getStarted.html">Get Started</a>
            <a href="/pages/leaderboard.html">Leaderboard</a>
            <a href="/pages/gameSelectionMenu.html">Join a Game</a>
            <a href="/pages/collaborativeCanvas.html">Collaborative Canvas</a>
            <a href="/pages/gamePlayCanvas.html">Play the Game</a>
        </nav>
    </header>

    <main class="min-h-[calc(100vh-160px)] flex flex-col justify-center items-center pt-20 pb-20">

        <div class="bg-white/85 rounded-xl px-8 py-12 max-w-3xl w-full flex flex-col items-center text-center overflow-auto">

            <h1 class="get-started-title" id="main-title">8 Bit Alley</h1>
    
            <div class="auth-forms">
                <!-- login -->
                <div>
                    <form action="/login" method="post" class="auth-form">
                        <h2>Login</h2>
                        <label for="login-username">Username:</label>
                        <input type="text" id="login-username" name="username" required />
                        <label for="login-password">Password:</label>
                        <input type="password" id="login-password" name="password" required />
                        <button type="submit">Login</button>
                    </form>
                </div>
        
                <!-- register -->
                <div>
                    <form action="/register" method="post" class="auth-form">
                        <h2>Register</h2>
                        <label for="register-username">Username:</label>
                        <input type="text" id="register-username" name="username" required />
                        <label for="register-password">Password:</label>
                        <input type="password" id="register-password" name="password" required />
                        <button type="submit">Register</button>
                    </form>
                </div>
            </div>

        </div>
    

    </main>

    <footer>
        <small>&copy; <span>2026</span></small> <span>|</span> <span><a href="https://github.com/aswens1/startup">Alyse's github repo</a></span>
    </footer>

</body>
</html>
