<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="8-Bit Alley is a pixel based arcade, where you can play pixel games with friends and contribute to the community canvas!" />
        <style>@import url('https://fonts.googleapis.com/css2?family=Jersey+10&family=Noto+Sans+Mono:wght@100..900&display=swap');</style>
        <title>Game Selection Menu - 8 Bit Alley</title>
      <link rel="stylesheet" crossorigin href="/assets/styles-xZ0M3iQZ.css">
    </head>

    <body>
        <header>
            <nav>
                <a href="../index.html">Home</a>
                <a href="/pages/getStarted.html">Get Started</a>
                <a href="/pages/leaderboard.html">Leaderboard</a>
                <a href="/pages/gameSelectionMenu.html">Join a Game</a>
                <a href="/pages/collaborativeCanvas.html">Collaborative Canvas</a>
                <a href="/pages/gamePlayCanvas.html">Play the Game</a>
            </nav>
        </header>

        <main class="min-h-[calc(100vh-160px)] flex justify-center pt-20 pb-20">
          <div class="bg-white/85 rounded-xl px-8 py-16 max-w-3xl w-full flex justify-center flex-col items-center text-center">


            <div class="grid grid-cols-2 grid-gap-4">

              <div class="grid">
                  <h1 class="font-['Jersey_10'] text-[4rem]">Join a Game</h1>

                  <form action="gamePlayCanvas.html" method="get">

                    <div class="overflow-y-auto max-h-96 p-4 mb-4 text-left">

                      <div class="game-option">
                        <label class="game-card">
                          <input type="radio" id="game1" name="game" value="pixel-chaos" />
                          <div class="game-info">
                            <div class="game-title">Mock Game 1</div>

                            <div class="meta">
                              <span>Game Type:</span> Pixel Chaos<br />
                              <span>Players:</span> 12 / 20<br />
                              <span>Teams:</span> 4<br />
                              <span>Colour Scheme:</span> Neon<br />
                              <span>Status:</span> In Progress
                            </div>
                          </div>
                        </label>
                      </div>
                          
                      <div class="game-option">
                        <label class="game-card">
                          <input type="radio" id="game2" name="game" value="retro-wall" />
                          <div class="game-info">
                            <div class="game-title">Mock Game 2</div>

                            <div class="meta">
                              <span>Game Type:</span> Retro Wall<br />
                              <span>Players:</span> 6 / 10<br />
                              <span>Teams:</span> 2<br />
                              <span>Colour Scheme:</span> 8-Bit Retro<br />
                              <span>Status:</span> Waiting for Players
                            </div>
                          </div>
                        </label>
                      </div>
                    
                      <div class="game-option">
                        <label class="game-card">
                          <input type="radio" id="game3" name="game" value="color-riot" />
                          <div class="game-info">
                            <div class="game-title">Mock Game 3</div>

                            <div class="meta">
                              <span>Game Type:</span> Color Riot<br />
                              <span>Players:</span> 18 / 30<br />
                              <span>Teams:</span> None (Free Draw)<br />
                              <span>Colour Scheme:</span> High Contrast<br />
                              <span>Status:</span> Almost Full
                            </div>
                          </div>
                        </label>
                      </div>

                      <div class="game-option">
                        <label class="game-card">
                          <input type="radio" id="game4" name="game" value="color-riot" />
                          <div class="game-info">
                            <div class="game-title">Mock Game 4</div>

                            <div class="meta">
                              <span>Game Type:</span> Color Riot<br />
                              <span>Players:</span> 18 / 30<br />
                              <span>Teams:</span> None (Free Draw)<br />
                              <span>Colour Scheme:</span> High Contrast<br />
                              <span>Status:</span> Almost Full
                            </div>
                          </div>
                        </label>
                      </div>

                    </div>
      
                    <button class="get-started-btn" type="submit">Join Selected Game</button>
                  </form>
                    
              </div>

              <div >
                  <h1 class="font-['Jersey_10'] text-[4rem] ">Create a Game</h1>

                  <div class="overflow-y-auto max-h-96 p-4 mb-4 text-left">

                    <form action="/createGame" method="post" class="grid grid-cols-1 gap-7" id="create-game">

                      <div class="create-game-section">
                        <label for="game-name">Game Name:</label>
                        <input class="input" type="text" id="game-name" name="gameName" required />
                      </div>
                      
                      <div class="create-game-section">
                        <label for="game-type">Game Type:</label>
                        <select class="input" id="game-type" name="gameType" required>
                            <option value=""></option>
                            <option value="filler1">filler type 1</option>
                            <option value="filler2">filler type 2</option>
                            <option value="filler3">filler type 3</option>
                        </select>
                      </div>

                      <div class="create-game-section">
                        <!--add max team/player limit that can't be changed- just won't let them put a number higher than-->
                        <label for="number-of-teams">Number of Teams:</label>
                        <input class="input" type="number" id="number-of-teams" name="numberOfTeams" required />
                      </div>

                      <button class="get-started-btn" type="submit">Create Game</button>

                      <!--make it so you can pick between number of teams or number of players? like set max number of players per team, or just a pvp, or etc-->
                    </form>

                  </div>
              </div>
            </div>
            
          </div>
        </main>




        <br />

        <footer>
            <small>&copy; <span>2026</span></small> <span>|</span> <span><a href="https://github.com/aswens1/startup">Alyse's github repo</a></span>
        </footer>
    </body>

</html>
