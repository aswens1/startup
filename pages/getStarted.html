<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Log in or Register" />
    <style>@import url('https://fonts.googleapis.com/css2?family=Jersey+10&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');</style>
    <link rel="stylesheet" href="../styles.css" />
    <title>Get Started - 8 Bit Alley</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>
            <a href="/pages/getStarted.html">Get Started</a>
            <a href="/pages/leaderboard.html">Leaderboard</a>
            <a href="/pages/gameSelectionMenu.html">Join a Game</a>
            <a href="/pages/collaborativeCanvas.html">Collaborative Canvas</a>
            <a href="/pages/gamePlayCanvas.html">Play the Game</a>
        </nav>
    </header>

    <main class="hero">

        <div class="content" id="get-started">
            <h1 id="main-title">Welcome to 8 Bit Alley</h1>
            <p>Login or sign up to join the fun!</p>
    
            <div class="auth-forms">
                <!-- login -->
                <div>
                    <form action="/login" method="post">
                        <h2>Login</h2>
                        <label for="login-username">Username:</label>
                        <input type="text" id="login-username" name="username" required />
                        <label for="login-password">Password:</label>
                        <input type="password" id="login-password" name="password" required />
                        <button type="submit">Login</button>
                    </form>
                </div>
        
                <!-- register -->
                <div>
                    <form action="/register" method="post">
                        <h2>Register</h2>
                        <label for="register-username">Username:</label>
                        <input type="text" id="register-username" name="username" required />
                        <label for="register-password">Password:</label>
                        <input type="password" id="register-password" name="password" required />
                        <button type="submit">Register</button>
                    </form>
                </div>
            </div>

        </div>
    

    </main>

    <footer>
        <small>&copy; <span>2026</span></small> <span>|</span> <span><a href="https://github.com/aswens1/startup">Alyse's github repo</a></span>
    </footer>

</body>
</html>
