<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="8-Bit Alley is a pixel based arcade, where you can play pixel games with friends and contribute to the community canvas!" />
    <link href="../styles.css" rel="stylesheet" />

    <style>@import url('https://fonts.googleapis.com/css2?family=Jersey+10&family=Noto+Sans+Mono:wght@100..900&display=swap');</style>

    <title>Leaderboard - 8 Bit Alley</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>
            <a href="/pages/getStarted.html">Get Started</a>
            <a href="/pages/leaderboard.html">Leaderboard</a>
            <a href="/pages/gameSelectionMenu.html">Join a Game</a>
            <a href="/pages/collaborativeCanvas.html">Collaborative Canvas</a>
            <a href="/pages/gamePlayCanvas.html">Play the Game</a>
        </nav>
    </header>

    <main class="min-h-[calc(100vh-160px)] flex justify-center pt-20 pb-20">
        <div class="bg-white/85 rounded-xl px-8 py-16 max-w-3xl w-full flex justify-center flex-col items-center text-center md:gap-y-5">

            <h1 class="font-['Jersey_10'] text-[7rem] tracking-wider leading-[0.9]">Leaderboard</h1>
            <p class="mt-6 text-xl">Place more pixels in the lobby and the games to see your name on the leaderboard!</p>

            <div class="leaderboard-scroll">
                <table class="w-full border-separate border-spacing-x-6">
                    <thead class="text-xl">
                        <tr>
                            <th>Rank</th>
                            <th>Username</th>
                            <th>Score</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>tempPlayer1</td>
                            <td>1500</td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>tempPlayer2</td>
                            <td>1450</td>
                        </tr>
                        <tr>
                            <td>3</td>
                            <td>tempPlayer3</td>
                            <td>1400</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer>
        <small>&copy; <span>2026</span></small> <span>|</span> <span><a href="https://github.com/aswens1/startup">Alyse's github repo</a></span>
    </footer>

</body>
</html>
